name: collect

on:
  schedule:
    - cron: "17 23 * * *"   # 매일 08:17 KST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/collect.py
      - name: Analyze
        run: python3 scripts/analyze.py
      - name: Commit
        run: |
          git config user.name "sdd-trend-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots reports
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "snapshot $(date -u +%F)"
          git push
